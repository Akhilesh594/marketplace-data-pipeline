version: 2

models:
  - name: stg_orders
    description: Orders with standardised statuses and converted date fields.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: order_purchase_at
        data_tests:
          - not_null